services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aeiforia_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d aeiforia_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://demo:demo_local_password@postgres:5432/aeiforia_demo
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      EMBEDDING_MODEL: gemini-embedding-2
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./knowledge:/app/knowledge:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data: